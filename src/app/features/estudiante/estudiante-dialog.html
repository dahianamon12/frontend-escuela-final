<h2 mat-dialog-title>{{ data.mode === 'create' ? 'Nuevo estudiante' : 'Editar estudiante' }}</h2>
<mat-dialog-content class="dialog-body">
  <form [formGroup]="form" class="grid">
    <mat-form-field appearance="outline">
      <mat-label>Nombre</mat-label>
      <input matInput formControlName="nombre" />
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Apellido</mat-label>
      <input matInput formControlName="apellido" />
    </mat-form-field>
    <mat-form-field appearance="outline" class="span-2">
      <mat-label>Código</mat-label>
      <input matInput formControlName="codigo" />
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Fecha de Nacimiento</mat-label>
      <input matInput type="date" formControlName="fecha_nacimiento" />
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Teléfono</mat-label>
      <input matInput formControlName="telefono" />
    </mat-form-field>
    <mat-form-field appearance="outline" class="span-2">
      <mat-label>Dirección</mat-label>
      <textarea matInput rows="2" formControlName="direccion"></textarea>
    </mat-form-field>
    <mat-slide-toggle formControlName="estado" class="span-2">Activo</mat-slide-toggle>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancel()">Cancelar</button>
  <button mat-flat-button color="primary" type="button" (click)="save()">Guardar</button>
</mat-dialog-actions>
