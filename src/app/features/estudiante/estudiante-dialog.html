<h2 mat-dialog-title>{{ data.mode === 'create' ? 'Nuevo estudiante' : 'Editar estudiante' }}</h2>
<mat-dialog-content class="dialog-body">
  <form [formGroup]="form" class="grid">
    @if (data.mode === 'create') {
      <mat-form-field appearance="outline" class="span-2">
        <mat-label>ID Usuario</mat-label>
        <input matInput formControlName="id_usuario" />
      </mat-form-field>
    }
    <mat-form-field appearance="outline" class="span-2">
      <mat-label>ID Grado</mat-label>
      <input matInput formControlName="id_grado" />
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Fecha de Nacimiento</mat-label>
      <input matInput type="date" formControlName="fecha_nacimiento" />
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Teléfono</mat-label>
      <input matInput formControlName="telefono" />
    </mat-form-field>
    <mat-form-field appearance="outline" class="span-2">
      <mat-label>Dirección</mat-label>
      <textarea matInput rows="2" formControlName="direccion"></textarea>
    </mat-form-field>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancel()">Cancelar</button>
  <button mat-flat-button color="primary" type="button" (click)="save()">Guardar</button>
</mat-dialog-actions>
