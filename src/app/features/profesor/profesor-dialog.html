<h2 mat-dialog-title>{{ data.mode === 'create' ? 'Nuevo profesor' : 'Editar profesor' }}</h2>
<mat-dialog-content class="dialog-body">
  <form [formGroup]="form" class="grid">
    @if (data.mode === 'create') {
      <mat-form-field appearance="outline" class="span-2">
        <mat-label>ID Usuario</mat-label>
        <input matInput formControlName="id_usuario" />
      </mat-form-field>
    }
    <mat-form-field appearance="outline" class="span-2">
      <mat-label>ID Departamento</mat-label>
      <input matInput formControlName="id_departamento" />
    </mat-form-field>
    <mat-form-field appearance="outline" class="span-2">
      <mat-label>Especialidad</mat-label>
      <input matInput formControlName="especialidad" />
    </mat-form-field>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancel()">Cancelar</button>
  <button mat-flat-button color="primary" type="button" (click)="save()">Guardar</button>
</mat-dialog-actions>
