<h2 mat-dialog-title>{{ data.mode === 'create' ? 'Nuevo curso' : 'Editar curso' }}</h2>
<mat-dialog-content class="dialog-body">
  <form [formGroup]="form" class="grid">
    <mat-form-field appearance="outline" class="span-2">
      <mat-label>Nombre del Curso</mat-label>
      <input matInput formControlName="nombre_curso" />
    </mat-form-field>
    <mat-form-field appearance="outline" class="span-2">
      <mat-label>Descripción</mat-label>
      <textarea matInput rows="3" formControlName="descripcion"></textarea>
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Horas Semanales</mat-label>
      <input matInput formControlName="horas_semanales" />
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>ID Profesor</mat-label>
      <input matInput formControlName="id_profesor" />
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>ID Grado</mat-label>
      <input matInput formControlName="id_grado" />
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>ID Aula</mat-label>
      <input matInput formControlName="id_aula" />
    </mat-form-field>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancel()">Cancelar</button>
  <button mat-flat-button color="primary" type="button" (click)="save()">Guardar</button>
</mat-dialog-actions>
