<div class="page-head">
  <h1>Aulas</h1>
  <button mat-flat-button color="primary" type="button" (click)="nuevo()">
    <mat-icon>add</mat-icon>
    Nueva
  </button>
</div>

@if (loading) {
  <div class="loading"><mat-spinner /></div>
} @else {
  <div class="table-wrap mat-elevation-z2">
    <table mat-table [dataSource]="dataSource">
      <ng-container matColumnDef="numero_aula">
        <th mat-header-cell *matHeaderCellDef>Número Aula</th>
        <td mat-cell *matCellDef="let r">{{ r.numero_aula }}</td>
      </ng-container>
      <ng-container matColumnDef="capacidad">
        <th mat-header-cell *matHeaderCellDef>Capacidad</th>
        <td mat-cell *matCellDef="let r">{{ r.capacidad || '—' }}</td>
      </ng-container>
      <ng-container matColumnDef="edificio">
        <th mat-header-cell *matHeaderCellDef>Edificio</th>
        <td mat-cell *matCellDef="let r">{{ r.edificio || '—' }}</td>
      </ng-container>
      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let r" class="actions">
          <button mat-icon-button type="button" (click)="editar(r)"><mat-icon>edit</mat-icon></button>
          <button mat-icon-button type="button" (click)="eliminar(r)"><mat-icon>delete</mat-icon></button>
        </td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
    <mat-paginator [pageSizeOptions]="[5, 10, 25]" showFirstLastButtons />
  </div>
}
