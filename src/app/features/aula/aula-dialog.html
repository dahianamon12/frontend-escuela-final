<h2 mat-dialog-title>{{ data.mode === 'create' ? 'Nueva aula' : 'Editar aula' }}</h2>
<mat-dialog-content class="dialog-body">
  <form [formGroup]="form" class="grid">
    <mat-form-field appearance="outline">
      <mat-label>Nombre</mat-label>
      <input matInput formControlName="nombre" />
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Código</mat-label>
      <input matInput formControlName="codigo" />
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Capacidad</mat-label>
      <input matInput type="number" formControlName="capacidad" />
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Ubicación</mat-label>
      <input matInput formControlName="ubicacion" />
    </mat-form-field>
    <mat-slide-toggle formControlName="estado" class="span-2">Activa</mat-slide-toggle>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancel()">Cancelar</button>
  <button mat-flat-button color="primary" type="button" (click)="save()">Guardar</button>
</mat-dialog-actions>
