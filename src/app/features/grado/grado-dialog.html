<h2 mat-dialog-title>{{ data.mode === 'create' ? 'Nuevo grado' : 'Editar grado' }}</h2>
<mat-dialog-content class="dialog-body">
  <form [formGroup]="form" class="grid">
    <mat-form-field appearance="outline" class="span-2">
      <mat-label>Nombre del Grado</mat-label>
      <input matInput formControlName="nombre_grado" />
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Nivel</mat-label>
      <input matInput formControlName="nivel" />
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Jornada</mat-label>
      <input matInput formControlName="jornada" />
    </mat-form-field>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancel()">Cancelar</button>
  <button mat-flat-button color="primary" type="button" (click)="save()">Guardar</button>
</mat-dialog-actions>
